# Static-site server for the Astro dist/ output.
# Listens on unprivileged 8080 (nginx-unprivileged native port) as non-root.
# Pretty URLs resolve via try_files; unknown paths fall back to the Astro
# 404 page. /404.html stays directly servable for verification.

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Hashed Astro assets are immutable — cache aggressively.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
